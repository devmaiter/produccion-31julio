<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>Backline en reels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Quicksand:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Lab: el backline de ESC 2 como reels. Arriba/abajo cambia de categoría (Batería, Platillos…),
   izquierda/derecha pasa de la portada al resumen y a cada banda. Todo es CSS scroll-snap nativo. */
:root{
  --bg:#000; --surface:#121212; --surface2:#1a1a1a; --line:#333;
  --ink:#fff; --ink2:#d6d6d6; --ink3:#9a9a9a;
  --accent:#ff6a1f; --accent-ink:#000; --ok:#3fbf77; --warn:#ffa83a;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --gx:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Feed vertical: un reel por pantalla */
#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;max-width:520px;margin:0 auto;position:relative}
#feed::-webkit-scrollbar{display:none}
.reel{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,hsl(var(--h) 90% 22%) 0%,#000 65%)}

/* Carrusel horizontal dentro del reel */
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;padding:calc(env(safe-area-inset-top) + 64px) 76px calc(env(safe-area-inset-bottom) + 34px) var(--gx);display:flex;flex-direction:column;overflow:hidden}

/* Barra de progreso tipo historias */
.prog{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;gap:4px;pointer-events:none}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.prog i.on{background:var(--ink)}
.cab{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 22px);left:16px;right:16px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);pointer-events:none}
.cab b{font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.cab .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink3)}

/* Portada */
.portada{justify-content:flex-end}
.holo{flex:1;min-height:0;position:relative;margin:0 -76px 8px calc(-1 * var(--gx));display:flex;align-items:center;padding-left:var(--gx)}
.holo .lienzo3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.holo.con3d .emoji{display:none}
.emoji{font-size:clamp(90px,30vw,150px);line-height:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));transform:scale(.6);opacity:0;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.reel.visto .emoji{transform:none;opacity:1}
.portada h2{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,76px);line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:0;color:var(--accent);text-wrap:balance;overflow-wrap:anywhere}
.big{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}
.big strong{font-family:var(--display);font-size:clamp(80px,26vw,128px);line-height:.85;font-variant-numeric:tabular-nums}
.big span{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);line-height:1}
.dias{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--ink);white-space:nowrap}
.chip.ac{background:var(--accent);color:var(--accent-ink)}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.ter{background:transparent;border:1px solid var(--ink3);color:var(--ink2)}
.pista{margin-top:18px;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.pista .flecha{display:inline-block;animation:empuja 1.4s ease-in-out infinite}
@keyframes empuja{50%{transform:translateX(8px)}}

/* Listas */
h3{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--ink2);font-size:14px;margin:0 0 14px}
ul.lista{list-style:none;margin:0;padding:0;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;mask-image:linear-gradient(#000 88%,transparent)}
ul.lista li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
ul.lista .q{font-family:var(--display);font-size:28px;font-weight:700;color:var(--accent);min-width:2.2ch;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
ul.lista .t{min-width:0;flex:1}
ul.lista .t small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
ul.lista .t .chip{font-size:11px;padding:1px 7px;margin:4px 4px 0 0;display:inline-block}
.barra{height:4px;border-radius:2px;background:var(--accent);opacity:.35;margin-top:6px}

/* Slide de banda con el stage plot de fondo */
.banda .fondo{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(16px) brightness(.22) saturate(.6);transform:scale(1.15);z-index:-1}
.banda{isolation:isolate}
.banda .plot{display:block;width:100%;max-height:26vh;object-fit:contain;border-radius:10px;background:#fff;margin:0 0 12px;cursor:zoom-in}
.hora{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

/* Riel de acciones a la derecha, como en los reels */
.riel{position:absolute;z-index:4;right:10px;bottom:calc(env(safe-area-inset-bottom) + 90px);display:flex;flex-direction:column;gap:18px;align-items:center}
.riel button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.riel .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);transition:transform .15s,background .15s}
.riel button:active .ic{transform:scale(.88)}
.riel .listo[aria-pressed="true"] .ic{background:var(--ok);color:#000}
.corazon{position:absolute;z-index:5;left:50%;top:45%;font-size:110px;pointer-events:none;transform:translate(-50%,-50%) scale(0);opacity:0}
.corazon.go{animation:pop .8s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}

/* Pista de deslizar hacia arriba en el primer reel */
.arriba{position:absolute;z-index:4;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);text-align:center;font-size:13px;color:var(--ink2);animation:sube 1.6s ease-in-out infinite;pointer-events:none}
@keyframes sube{50%{transform:translateY(-8px);opacity:.6}}

/* Índice y visor */
.hoja{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.hoja .panel{width:100%;max-width:520px;max-height:80dvh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.hoja h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0 0 8px;color:var(--accent)}
.hoja .fila{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.hoja .fila .e{font-size:24px}
.hoja .fila .x{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums}
.hoja .fila .ok{color:var(--ok);font-weight:700}
.visor{position:fixed;inset:0;z-index:11;background:#000;display:grid;place-items:center;padding:16px}
.visor img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.aviso{position:fixed;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#000;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600}
.cargando{height:100dvh;display:grid;place-items:center;color:var(--ink3);text-align:center;padding:16px}
@media (min-width:700px){
  body{background:radial-gradient(circle at 50% 30%,#1a0d05,#000 60%)}
  #feed{border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .teclas{position:fixed;left:24px;bottom:24px;max-width:230px;font-size:13px;color:var(--ink3)}
  .teclas kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink2)}
}
@media (max-width:699px){.teclas{display:none}}
@media (min-width:900px) and (hover:hover){.teclas{left:auto;right:24px;text-align:right}}

/* En PC no se desliza con el dedo: flechas sobre el reel, ↑ ↓ al lado y el índice fijo a la izquierda. */
.lado,.flechas-v,.pasar{display:none}
@media (hover:hover) and (pointer:fine){
  .pasar{display:grid;place-items:center;position:absolute;z-index:4;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--line);font-size:20px;color:var(--ink);opacity:.75;transition:opacity .15s,background .15s}
  .pasar:hover,.pasar:focus-visible{opacity:1;background:var(--accent);color:var(--accent-ink);outline:none}
  .pasar.ant{left:8px}.pasar.sig{right:8px}
  :root{--gx:58px}
  .pasar[disabled]{display:none}
  .reel .riel{right:12px}
}
@media (min-width:900px) and (hover:hover){
  .flechas-v{display:flex;flex-direction:column;gap:10px;position:fixed;z-index:6;top:50%;left:calc(50% + 260px + 20px);transform:translateY(-50%)}
  .flechas-v button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;transition:background .15s,border-color .15s}
  .flechas-v button:hover,.flechas-v button:focus-visible{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);outline:none}
  .flechas-v button[disabled]{opacity:.3;pointer-events:none}
  .lado{display:block;position:fixed;z-index:6;top:24px;bottom:120px;right:calc(50% + 260px + 24px);width:min(240px,calc(50vw - 300px));overflow-y:auto;scrollbar-width:thin}
  .lado h1{font-family:var(--display);font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin:0 0 4px}
  .lado p{font-size:12px;color:var(--ink3);margin:0 0 14px}
  .lado button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;color:var(--ink2);transition:background .15s}
  .lado button:hover,.lado button:focus-visible{background:var(--surface2);outline:none}
  .lado button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
  .lado .e{font-size:18px;width:24px;text-align:center}
  .lado .x{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink3);font-size:13px}
  .lado .ok{color:var(--ok);font-weight:700}
}
@media (prefers-reduced-motion:reduce){.emoji,.pista .flecha,.arriba,.corazon.go{animation:none;transition:none}.emoji{transform:none;opacity:1}}

/* ── Reel "Sube un documento": orbe que late, anillos que giran y documentos que suben ── */
.reel.subir{background:radial-gradient(90% 60% at 50% 30%,#3a1606 0%,#000 70%)}
.subir .slide{align-items:center;text-align:center;justify-content:center;gap:14px;padding-inline:24px}
.orbe{position:relative;width:min(56vw,230px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:10px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.orbe::before,.orbe::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:onda 2.4s ease-out infinite}
.orbe::after{animation-delay:1.2s}
@keyframes onda{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.orbe .anillo{position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,var(--accent) 75%,#ffd2b5 82%,transparent 90%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:gira 2.2s linear infinite}
@keyframes gira{to{transform:rotate(1turn)}}
.orbe .nucleo{width:58%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb27f,var(--accent) 45%,#a43a00);display:grid;place-items:center;font-family:var(--display);font-size:clamp(56px,18vw,90px);font-weight:700;color:#000;box-shadow:0 0 60px rgba(255,106,31,.55);animation:late 1.6s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.07);box-shadow:0 0 90px rgba(255,106,31,.8)}}
.flotan{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flotan span{position:absolute;bottom:-40px;font-size:28px;opacity:0;animation:sube-doc 6s linear infinite}
@keyframes sube-doc{0%{transform:translateY(0) rotate(-10deg);opacity:0}10%{opacity:.85}80%{opacity:.6}100%{transform:translateY(-105dvh) rotate(14deg);opacity:0}}
.subir h2{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,64px);line-height:.9;text-transform:uppercase;margin:0;color:var(--ink);text-wrap:balance}
.subir h2 em{font-style:normal;color:var(--accent)}
.subir .sub{max-width:34ch;margin:0}
.entrenar{font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}
.botones{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:10px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);transition:transform .12s}
.btn:active{transform:scale(.94)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.orbe:focus-visible{outline:3px solid #fff;outline-offset:3px}
.fuente{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--ink3);align-items:center}
.fuente button{padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font-size:13px}
.fuente button[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.archivos{list-style:none;margin:0;padding:0;width:100%;max-width:360px;text-align:left;font-size:13px}
.archivos li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.archivos li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.archivos li span:last-child{color:var(--ink3);white-space:nowrap}
.archivos li.ok span:last-child{color:var(--ok)} .archivos li.err span:last-child{color:var(--warn)}
/* Leyendo: la hoja con una línea que la barre */
.hojita{position:relative;width:130px;height:170px;border-radius:10px;background:#f4f4f4;overflow:hidden;box-shadow:0 0 50px rgba(255,106,31,.4)}
.hojita i{display:block;height:8px;margin:14px 14px 0;border-radius:4px;background:#cfcfcf}
.hojita i:nth-child(odd){width:60%}
.hojita::after{content:"";position:absolute;left:0;right:0;height:36px;background:linear-gradient(transparent,rgba(255,106,31,.75),transparent);animation:barre 1.3s ease-in-out infinite alternate}
@keyframes barre{from{top:-36px}to{top:170px}}
/* Listo: número grande y lluvia de emojis de las categorías encontradas */
.encontre strong{display:block;font-family:var(--display);font-size:clamp(90px,30vw,140px);line-height:.85;color:var(--accent)}
.lluvia{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.lluvia span{position:absolute;top:-50px;font-size:34px;animation:cae 1.8s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes cae{to{transform:translateY(115dvh) rotate(var(--r));}}

/* ── Primera vez: logo con glitch y la mano que enseña a deslizar, como al abrir TikTok ── */
.splash{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;transition:opacity .45s}
.splash.fuera{opacity:0;pointer-events:none}
/* Logo de Circuito Naranja: "circuit" + la "o" como conector XLR, y "Naranja" espaciado. Tres copias: blanca encima y cian/naranja corridas con cortes, como el glitch de TikTok. */
.logo{position:relative;color:#fff;animation:entra .7s cubic-bezier(.2,1.5,.4,1) both}
.logo .capa{display:flex;flex-direction:column;align-items:center}
.logo .capa+.capa{position:absolute;inset:0;mix-blend-mode:screen}
.logo .cian{color:#25f4ee;transform:translate(-4px,-2px);animation:glitch 1.1s steps(2) infinite}
.logo .nar{color:var(--accent);transform:translate(4px,2px);animation:glitch 1.1s steps(2) infinite reverse}
.logo .marca{display:flex;align-items:center;font-family:"Quicksand","Comfortaa",var(--body);font-weight:500;font-size:clamp(58px,18vw,120px);line-height:1;letter-spacing:-.01em}
.logo svg{width:.86em;height:.86em;margin-left:.04em;flex:none}
.logo .naranja{font-family:"Quicksand",var(--body);font-size:clamp(14px,4vw,22px);letter-spacing:.9em;margin:10px 0 0 .9em}
.logo small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.3em;color:var(--ink3);margin-top:26px;text-align:center}
@keyframes entra{from{transform:scale(.3);opacity:0}}
@keyframes glitch{0%{clip-path:inset(0 0 60% 0)}25%{clip-path:inset(40% 0 20% 0)}50%{clip-path:inset(70% 0 0 0)}75%{clip-path:inset(10% 0 70% 0)}100%{clip-path:inset(0 0 60% 0)}}
.guia{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;animation:aparece .35s ease-out both}
@keyframes aparece{from{opacity:0}}
.guia p{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;margin:0;max-width:12ch}
.guia small{color:var(--ink2);font-size:14px}
.mano{position:relative;width:90px;height:150px}
.mano .dedo{position:absolute;left:50%;font-size:64px;line-height:1;transform:translateX(-50%)}
.mano .estela{position:absolute;left:50%;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(transparent,rgba(255,255,255,.8))}
.guia.arriba-g .dedo{animation:dedo-v 1.5s ease-in-out infinite}
.guia.arriba-g .estela{bottom:40px;height:0;animation:estela-v 1.5s ease-in-out infinite}
@keyframes dedo-v{0%{top:90px;opacity:0}15%{opacity:1}70%{top:0;opacity:1}100%{top:0;opacity:0}}
@keyframes estela-v{0%,15%{height:0}70%{height:90px;opacity:1}100%{height:90px;opacity:0}}
.guia.lado-g .mano{width:170px;height:90px}
.guia.lado-g .dedo{top:10px;animation:dedo-h 1.5s ease-in-out infinite}
.guia.lado-g .estela{display:none}
@keyframes dedo-h{0%{left:140px;opacity:0}15%{opacity:1}70%{left:30px;opacity:1}100%{left:30px;opacity:0}}
.guia.toque-g .dedo{top:30px;animation:toque 1.2s ease-in-out infinite}
@keyframes toque{0%,40%,80%,100%{transform:translateX(-50%) scale(1)}20%,60%{transform:translateX(-50%) scale(.82)}}
@media (prefers-reduced-motion:reduce){.orbe::before,.orbe::after,.orbe .anillo,.orbe .nucleo,.flotan span,.hojita::after,.logo,.logo::before,.logo::after,.mano *{animation:none!important}}
</style>
</head>
<body>
<main id="feed" aria-label="Backline por categoría"></main>
<div class="teclas"><b>Lab reels.</b> En el celular se desliza. Aquí: <kbd>↑</kbd><kbd>↓</kbd> categoría, <kbd>←</kbd><kbd>→</kbd> banda, doble clic marca listo. Arriba de todo: ＋ subir un documento.</div>
<nav class="lado" id="lado" aria-label="Categorías"></nav>
<div class="flechas-v"><button id="sube" aria-label="Categoría anterior">↑</button><button id="baja" aria-label="Categoría siguiente">↓</button></div>
<div class="hoja" id="indice" hidden><div class="panel" role="dialog" aria-label="Índice"><h4>Categorías</h4><div id="filas"></div></div></div>
<div class="visor" id="visor" hidden><img alt=""></div>

<script>
/* El lector de PDF usa Map.getOrInsert(Computed), que solo traen los navegadores más nuevos. */
for (const C of [Map, WeakMap]) {
  if (!C.prototype.getOrInsertComputed) C.prototype.getOrInsertComputed = function(k, f){ if (!this.has(k)) this.set(k, f(k)); return this.get(k); };
  if (!C.prototype.getOrInsert) C.prototype.getOrInsert = function(k, v){ if (!this.has(k)) this.set(k, v); return this.get(k); };
}
const BASE_IMG = "../extractor/data/";
const LECTOR = new URL("../cordillera/lector/", location.href).href;   // el mismo lector de "Subir documento"
const MUESTRA = "../extractor/muestras/hoja-backline.pdf";
const ORDEN = ["Batería","Platillos","Percusión","Teclado","Ampli bajo","Ampli guitarra","Guitarra","Bajo","Bases","Escenario","Cables y energía","DJ","Otro"];
const EMOJI = {"Batería":"🥁","Platillos":"🔔","Percusión":"🪘","Teclado":"🎹","Ampli bajo":"🔊","Ampli guitarra":"📢","Guitarra":"🎸","Bajo":"🎸","Bases":"🎙️","Escenario":"🏗️","Cables y energía":"🔌","DJ":"🎧","Otro":"📦"};
const HUE = {"Batería":20,"Platillos":45,"Percusión":5,"Teclado":265,"Ampli bajo":200,"Ampli guitarra":340,"Guitarra":30,"Bajo":180,"Bases":220,"Escenario":120,"Cables y energía":55,"DJ":290,"Otro":0};
const PC = matchMedia("(hover: hover) and (pointer: fine)").matches;
const QUIETO = matchMedia("(prefers-reduced-motion: reduce)").matches;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const escribir = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function aviso(t){
  const a = document.createElement("div"); a.className = "aviso"; a.textContent = t;
  document.body.append(a); setTimeout(() => a.remove(), 1800);
}

/* ── El documento que subió la persona, guardado en el dispositivo. Sin documento solo está el reel de subir. ── */
let doc = leer("lab-reels:doc", null);        // {nombre, archivos, cuando, datos}
let listos = new Set();
const cargarListos = () => { listos = new Set(leer("lab-reels:listos:doc", [])); };
const guardarListos = () => escribir("lab-reels:listos:doc", [...listos]);
const VACIO = {artistas: [], dias: [], bloques: [], stagePlots: [], items: []};
const datos = () => doc?.datos || VACIO;
const titulo = () => doc ? doc.nombre : "Sube un documento para empezar";

/* Agrupa los ítems por categoría: totales por día (se suman), "a tener" = máximo entre días,
   resumen por referencia y una ficha por banda. */
function armar(d){
  const art = Object.fromEntries(d.artistas.map(a => [a.id, a.nombre]));
  const dia = Object.fromEntries(d.dias.map(x => [x.id, x.nombre]));
  const corto = Object.fromEntries(d.dias.map(x => [x.id, x.nombre.replace(/^(\S{3})\S*/, "$1").replace(/ · .*/, "")]));
  const show = {}; for (const b of d.bloques) if (b.tipo === "show" && b.artistaId) show[b.diaId + "|" + b.artistaId] = b;
  const plot = {}; for (const p of d.stagePlots) plot[p.artistaId] = BASE_IMG + p.archivo;
  const diasShow = d.dias.filter(x => x.tipo === "show").map(x => x.id);
  const cats = new Map();
  for (const it of d.items) {
    if (!cats.has(it.categoria)) cats.set(it.categoria, []);
    cats.get(it.categoria).push(it);
  }
  const pos = c => ORDEN.includes(c) ? ORDEN.indexOf(c) : 99;
  return [...cats.keys()].sort((a,b) => pos(a) - pos(b)).map(cat => {
    const items = cats.get(cat);
    const porDia = Object.fromEntries(diasShow.map(id => [id, 0]));
    const refs = new Map(), bandas = new Map();
    for (const it of items) {
      porDia[it.diaId] = (porDia[it.diaId] || 0) + it.cantidad;
      const r = refs.get(it.referencia) || {ref: it.referencia, dias:{}};
      r.dias[it.diaId] = (r.dias[it.diaId] || 0) + it.cantidad;
      refs.set(it.referencia, r);
      const k = it.diaId + "|" + it.artistaId;
      if (!bandas.has(k)) bandas.set(k, {nombre: art[it.artistaId] || it.artistaId, dia: dia[it.diaId], show: show[k], plot: plot[it.artistaId], items: []});
      bandas.get(k).items.push(it);
    }
    const resumen = [...refs.values()].map(r => ({ref: r.ref, q: Math.max(...Object.values(r.dias))})).sort((a,b) => b.q - a.q || a.ref.localeCompare(b.ref));
    const orden = [...bandas.values()].sort((a,b) => (a.dia + (a.show?.inicio || "")).localeCompare(b.dia + (b.show?.inicio || "")));
    return {cat, id: slug(cat), porDia, corto, aTener: resumen.reduce((s,r) => s + r.q, 0), resumen, bandas: orden, dudosos: items.filter(i => i.porConfirmar).length};
  });
}

/* Lo que devuelve el lector → el mismo formato de datos que Cordillera, para armar los reels. */
function aDatos(ext){
  const fechas = [...new Set(ext.items.map(i => i.fecha).filter(Boolean))].sort();
  const nombreDia = f => new Date(f + "T12:00").toLocaleDateString("es", {weekday: "long", day: "numeric"}).replace(/^./, c => c.toUpperCase());
  const dias = fechas.map(f => ({id: "d-" + f, nombre: nombreDia(f), tipo: "show"}));
  if (ext.items.some(i => !i.fecha)) dias.push({id: "d-doc", nombre: "Del documento", tipo: "show"});
  const artistas = new Map();
  // "Opción 2": alternativa del rider, no se pide además de la opción 1.
  const items = ext.items.filter(i => !/no suma/.test(i.nota || "")).map((i, n) => {
    const nombre = (i.artista || "").trim() || "Sin banda";
    const id = slug(nombre) || "sin-banda";
    artistas.set(id, nombre);
    const nota = [i.nota, i.grupo].filter(Boolean).join(" · ");
    return {id: "doc-" + n, diaId: i.fecha ? "d-" + i.fecha : "d-doc", artistaId: id, cantidad: Math.max(0, Math.round(+i.cantidad || 0)) || 1,
      categoria: i.categoria || "Otro", referencia: i.descripcion, descripcion: nota || i.descripcion,
      propietario: i.proveedor === "ARTISTA" ? {tipo: "tercero", nombre: "la banda"} : {tipo: "propio"}, porConfirmar: !!i.dudoso};
  });
  return {artistas: [...artistas].map(([id, nombre]) => ({id, nombre})), dias, bloques: [], stagePlots: [], items};
}

/* ── Reel 0: subir un documento ── */
const subida = {estado: "inicio", archivos: [], resultado: null, error: ""};
function htmlSubir(){
  const s = subida;
  const flotan = QUIETO ? "" : `<div class="flotan" aria-hidden="true">${["📄","🧾","📸","📊","✉️","📄","🎸","🥁"].map((e,i) => `<span style="left:${8 + i*11.5}%;animation-delay:${(i*0.75).toFixed(2)}s">${e}</span>`).join("")}</div>`;
  const pie = doc && s.estado !== "leyendo" ? `<div class="fuente">Tu documento: <b>${esc(doc.nombre)}</b> · ${doc.datos.items.length} ítems <button data-acc="borrar">Borrar</button></div>` : "";
  const lista = s.archivos.length ? `<ul class="archivos">${s.archivos.map(a => `<li class="${a.clase}"><span>${esc(a.nombre)}</span><span>${esc(a.estado)}</span></li>`).join("")}</ul>` : "";
  let cuerpo;
  if (s.estado === "leyendo") cuerpo = `
      <div class="hojita" aria-hidden="true">${"<i></i>".repeat(9)}</div>
      <h2>Leyendo<em>…</em></h2>
      <p class="sub" id="lento">Todo pasa en este dispositivo. Una foto tarda más porque hay que reconocer las letras.</p>${lista}`;
  else if (s.estado === "error") cuerpo = `
      <div class="encontre" aria-hidden="true"><strong>⚠</strong></div>
      <h2>${esc(s.error.titulo)}</h2>
      <p class="sub">${esc(s.error.texto)}</p>
      ${s.error.avisos?.length ? `<ul class="archivos">${s.error.avisos.slice(0, 6).map(a => `<li><span>${esc(a)}</span></li>`).join("")}</ul>` : ""}
      <div class="botones"><button class="btn" data-acc="elegir">Probar con otro archivo</button><button class="btn sec" data-acc="muestra">Probar con un ejemplo</button></div>${lista}`;
  else if (s.estado === "listo") {
    const r = s.resultado;
    cuerpo = `
      <div class="encontre"><strong data-to="${r.items}">${r.items}</strong></div>
      <h2>Ítems <em>encontrados</em></h2>
      <p class="sub">${r.bandas} ${r.bandas === 1 ? "banda" : "bandas"} · ${r.cats} ${r.cats === 1 ? "categoría" : "categorías"}${r.dudosos ? ` · ${r.dudosos} por confirmar` : ""}${r.avisos ? ` · ${r.avisos} ${r.avisos === 1 ? "aviso" : "avisos"} del lector` : ""}</p>
      <div class="botones"><button class="btn" data-acc="ver">Ver mis reels ${PC ? "↓" : "↑"}</button><button class="btn sec" data-acc="otro">Subir otro</button></div>${lista}`;
  } else cuerpo = `
      <button class="orbe" data-acc="elegir" aria-label="Elegir un documento"><span class="anillo"></span><span class="nucleo">+</span></button>
      <h2>Sube un <em>documento</em></h2>
      <p class="sub">Rider en PDF, foto de la hoja, Excel del desglose o el correo. Sale un reel por cada categoría. Se lee en tu dispositivo, sin internet.</p>
      <div class="botones"><button class="btn" data-acc="elegir">Elegir archivo</button><button class="btn sec" data-acc="foto">Tomar foto</button><button class="btn sec" data-acc="muestra">Probar con un ejemplo</button></div>
      <a class="entrenar" href="../entrenar/">¿Quieres revisarlo renglón por renglón antes? Entrena el lector →</a>${lista}`;
  return `
  <article class="reel subir" id="subir" data-n="1" aria-label="Subir documento">
    ${flotan}
    <div class="slides"><section class="slide">
      ${cuerpo}
      ${pie}
    </section></div>
    <input type="file" id="archivo" hidden multiple accept=".pdf,.xlsx,.xls,.csv,.txt,.eml,image/*">
    <input type="file" id="camara" hidden accept="image/*" capture="environment">
  </article>`;
}

function htmlReel(c, i, total){
  const n = 2 + c.bandas.length;
  const dias = Object.entries(c.porDia).filter(([,q]) => q).map(([id,q]) => `<span class="chip">${esc(c.corto[id])} · ${q}</span>`).join("");
  const max = c.resumen[0]?.q || 1;
  const resumen = c.resumen.map(r => `<li><span class="q">${r.q}</span><span class="t">${esc(r.ref)}<div class="barra" style="width:${Math.max(8, 100*r.q/max)}%"></div></span></li>`).join("");
  const bandas = c.bandas.map(b => `
    <section class="slide banda">
      ${b.plot ? `<div class="fondo" style="background-image:url('${esc(b.plot)}')"></div>` : ""}
      <h3>${esc(b.nombre)}</h3>
      <p class="sub"><span class="hora">${esc(b.dia)}${b.show ? " · " + esc(b.show.inicio) : ""}</span> · ${b.items.reduce((s,x)=>s+x.cantidad,0)} piezas</p>
      ${b.plot ? `<img class="plot" src="${esc(b.plot)}" alt="Stage plot de ${esc(b.nombre)}" loading="lazy">` : ""}
      <ul class="lista">${b.items.map(x => `<li><span class="q">${x.cantidad}</span><span class="t">${esc(x.referencia)}
        ${x.descripcion !== x.referencia ? `<small>${esc(x.descripcion)}</small>` : ""}
        ${x.propietario?.tipo === "tercero" ? `<span class="chip ter">Lo trae ${esc(x.propietario.nombre || "un tercero")}</span>` : ""}
        ${x.porConfirmar ? `<span class="chip warn">Por confirmar</span>` : ""}</span></li>`).join("")}</ul>
    </section>`).join("");
  return `
  <article class="reel" id="${c.id}" style="--h:${HUE[c.cat] ?? 20}" data-n="${n}" aria-label="${esc(c.cat)}">
    <div class="prog">${"<i></i>".repeat(n)}</div>
    <div class="cab"><b>${esc(c.cat)}</b><span class="n">${i+1}/${total}</span></div>
    <div class="slides">
      <section class="slide portada">
        <div class="holo" data-cat="${esc(c.cat)}"><div class="emoji" aria-hidden="true">${EMOJI[c.cat] || "📦"}</div></div>
        <h2>${esc(c.cat)}</h2>
        <div class="big"><strong data-to="${c.aTener}">${c.aTener}</strong><span>piezas<br>a tener</span></div>
        <div class="dias">${dias}<span class="chip ac">${c.bandas.length} ${c.bandas.length === 1 ? "banda" : "bandas"}</span>${c.dudosos ? `<span class="chip warn">${c.dudosos} por confirmar</span>` : ""}</div>
        <p class="pista">${PC ? "Pasa con › para ver banda por banda" : "Desliza para ver banda por banda"} <span class="flecha">→</span></p>
      </section>
      <section class="slide">
        <h3>Qué hay que tener</h3>
        <p class="sub">Por referencia. Se suma dentro del día y se toma el máximo entre días.</p>
        <ul class="lista">${resumen}</ul>
      </section>
      ${bandas}
    </div>
    <button class="pasar ant" aria-label="Anterior" disabled>‹</button>
    <button class="pasar sig" aria-label="Siguiente">›</button>
    <div class="riel">
      <button class="listo" aria-pressed="${listos.has(c.id)}"><span class="ic">✓</span><span>Listo</span></button>
      <button class="compartir"><span class="ic">↗</span><span>Enviar</span></button>
      <button class="ver-indice"><span class="ic">☰</span><span>Índice</span></button>
      <button class="ir-subir"><span class="ic">＋</span><span>Subir</span></button>
    </div>
    <div class="corazon" aria-hidden="true">✅</div>
  </article>`;
}

function contar(el){
  if (!el || !el.dataset.to) return;
  const to = +el.dataset.to; if (QUIETO) return;
  const t0 = performance.now();
  const paso = t => { const k = Math.min(1, Math.max(0, (t - t0) / 700)); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}

/* Holograma 3D de la rama de reconocimiento-3d en la portada. Si no hay WebGL se queda el emoji. */
let holo3d = null;
const holo3dListo = import("./holograma.js").then(m => holo3d = m).catch(() => null);
function holograma(r){
  holo3dListo.then(() => {
    const h = r.querySelector(".holo"), tipo = h && holo3d?.MODELO[h.dataset.cat];
    if (!tipo) { holo3d?.pausar(); return; }
    try {
      if (!holo3d.mostrar(h, tipo, datos().items, h.dataset.cat)) return;
      document.querySelectorAll(".holo.con3d").forEach(x => x !== h && x.classList.remove("con3d"));
      h.classList.add("con3d");
    } catch { holo3d = null; }
  });
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) holo3d?.pausar();
  else if (actual) holograma(actual);
});

/* ── Feed ── */
const feed = document.getElementById("feed");
let cats = [], reels = [], actual = null, io = null;

function pintar(destino){
  cargarListos();
  cats = armar(datos());
  feed.innerHTML = htmlSubir() + cats.map((c,i) => htmlReel(c, i, cats.length)).join("");
  reels = [...feed.querySelectorAll(".reel")];
  actual = reels[0];
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const r = e.target; actual = r;
    if (!r.classList.contains("visto")) { r.classList.add("visto"); contar(r.querySelector(".big strong, .encontre strong")); }
    holograma(r);
    history.replaceState(null, "", r.id === "subir" ? location.pathname : "#" + r.id);
    pintarLado();
    guiaAlLlegar(r);
  }), {root: feed, threshold: .6});
  reels.forEach(r => io.observe(r));
  for (const r of reels) {
    const s = r.querySelector(".slides"), marcas = r.querySelectorAll(".prog i");
    const ant = r.querySelector(".pasar.ant"), sig = r.querySelector(".pasar.sig");
    if (!ant) continue;
    const progreso = () => {
      const k = Math.round(s.scrollLeft / s.clientWidth);
      marcas.forEach((m,j) => m.classList.toggle("on", j <= k));
      ant.disabled = k === 0; sig.disabled = k >= marcas.length - 1;
    };
    s.addEventListener("scroll", progreso, {passive: true}); progreso();
  }
  pintarLado();
  const ir = destino && document.getElementById(destino);
  if (ir) ir.scrollIntoView();
}

/* Solo vuelve a dibujar el reel de subir, sin perder el lugar en el feed. */
function pintarSubir(){
  const viejo = document.getElementById("subir"); if (!viejo) return;
  const t = document.createElement("template"); t.innerHTML = htmlSubir().trim();
  const nuevo = t.content.firstElementChild;
  viejo.replaceWith(nuevo); reels[0] = nuevo; if (actual === viejo) actual = nuevo;
  io.observe(nuevo);
  contar(nuevo.querySelector(".encontre strong"));
}

function marcar(r, forzar){
  const b = r.querySelector(".listo"); if (!b) return;
  const on = forzar ?? !listos.has(r.id);
  on ? listos.add(r.id) : listos.delete(r.id); guardarListos(); pintarLado();
  b.setAttribute("aria-pressed", on);
  if (on) { const c = r.querySelector(".corazon"); c.classList.remove("go"); void c.offsetWidth; c.classList.add("go"); }
}

const mover = {
  ArrowDown: () => reels[reels.indexOf(actual)+1]?.scrollIntoView({behavior:"smooth"}),
  ArrowUp: () => reels[reels.indexOf(actual)-1]?.scrollIntoView({behavior:"smooth"}),
  ArrowRight: (r = actual) => { const s = r.querySelector(".slides"); s.scrollBy({left: s.clientWidth, behavior:"smooth"}); },
  ArrowLeft: (r = actual) => { const s = r.querySelector(".slides"); s.scrollBy({left: -s.clientWidth, behavior:"smooth"}); },
};

feed.addEventListener("click", async e => {
  const r = e.target.closest(".reel"); if (!r) return;
  const acc = e.target.closest("[data-acc]")?.dataset.acc;
  if (acc === "elegir") return document.getElementById("archivo").click();
  if (acc === "foto") return document.getElementById("camara").click();
  if (acc === "muestra") return probarMuestra();
  if (acc === "otro") { subida.estado = "inicio"; subida.archivos = []; return pintarSubir(); }
  if (acc === "borrar") { doc = null; escribir("lab-reels:doc", null); escribir("lab-reels:listos:doc", null); subida.estado = "inicio"; subida.archivos = []; return pintar("subir"); }
  if (acc === "ver") return reels[1]?.scrollIntoView({behavior: "smooth"});
  if (e.target.closest(".listo")) return marcar(r);
  if (e.target.closest(".ir-subir")) return reels[0].scrollIntoView({behavior: "smooth"});
  if (e.target.closest(".compartir")) {
    const url = location.href.split("#")[0] + "#" + r.id, t = "Backline · " + r.getAttribute("aria-label");
    try { if (navigator.share) await navigator.share({title: t, url}); else { await navigator.clipboard.writeText(url); aviso("Enlace copiado"); } } catch {}
    return;
  }
  if (e.target.closest(".ver-indice")) return abrirIndice();
  const p = e.target.closest(".pasar");
  if (p) return mover[p.classList.contains("sig") ? "ArrowRight" : "ArrowLeft"](r);
  const img = e.target.closest(".plot");
  if (img) { const v = document.getElementById("visor"); v.querySelector("img").src = img.src; v.hidden = false; }
});
feed.addEventListener("change", e => {
  if (e.target.matches("#archivo, #camara")) { const fs = [...e.target.files]; e.target.value = ""; subirArchivos(fs); }
});
// Doble toque en cualquier parte = listo, igual que el "me gusta".
feed.addEventListener("dblclick", e => { if (!e.target.closest(".riel, .pasar, .subir")) marcar(e.target.closest(".reel"), true); });
document.getElementById("visor").addEventListener("click", e => e.currentTarget.hidden = true);

const indice = document.getElementById("indice");
const filaIndice = (c, cls, actualId) => `<button class="${cls}" data-id="${c.id}" aria-current="${actualId === c.id}"><span class="e">${EMOJI[c.cat] || "📦"}</span><span>${esc(c.cat)}</span><span class="x">${listos.has(c.id) ? '<span class="ok">✓ </span>' : ""}${c.aTener}</span></button>`;
const filaSubir = (cls, actualId) => `<button class="${cls}" data-id="subir" aria-current="${actualId === "subir"}"><span class="e">＋</span><span>Subir documento</span></button>`;
function abrirIndice(){
  document.getElementById("filas").innerHTML = filaSubir("fila") + cats.map(c => filaIndice(c, "fila")).join("");
  indice.hidden = false;
}
indice.addEventListener("click", e => {
  const f = e.target.closest(".fila");
  indice.hidden = true;
  if (f) document.getElementById(f.dataset.id).scrollIntoView({behavior: "smooth"});
});
addEventListener("keydown", e => {
  if (!indice.hidden || !document.getElementById("visor").hidden) { if (e.key === "Escape") indice.hidden = document.getElementById("visor").hidden = true; return; }
  if (document.querySelector(".guia, .splash:not(.fuera)")) return;
  if (mover[e.key] && actual) { e.preventDefault(); mover[e.key](); }
});
document.getElementById("sube").addEventListener("click", () => mover.ArrowUp());
document.getElementById("baja").addEventListener("click", () => mover.ArrowDown());

// Índice fijo a la izquierda en PC.
const lado = document.getElementById("lado");
function pintarLado(){
  lado.innerHTML = `<h1>Backline en reels</h1><p>${esc(titulo())}</p>` + filaSubir("", actual?.id) + cats.map(c => filaIndice(c, "", actual?.id)).join("");
  document.getElementById("sube").disabled = actual === reels[0];
  document.getElementById("baja").disabled = actual === reels[reels.length - 1];
}
lado.addEventListener("click", e => { const b = e.target.closest("button"); if (b) document.getElementById(b.dataset.id).scrollIntoView({behavior: "smooth"}); });

/* ── Leer con el lector (el mismo de la lista de Cordillera) ── */
let lectorCargando = null;
function cargarLector(){
  if (window.LectorBackline) return Promise.resolve(window.LectorBackline);
  return lectorCargando ??= new Promise((ok, mal) => {
    const sc = document.createElement("script"); sc.src = LECTOR + "lector.js";
    sc.onload = () => window.LectorBackline ? ok(window.LectorBackline) : mal(new Error("El lector no cargó."));
    sc.onerror = () => { lectorCargando = null; mal(new Error("No pude cargar el lector. Revisa la conexión y vuelve a intentar.")); };
    document.head.append(sc);
  });
}

function fallo(titulo, texto, avisos){
  subida.estado = "error"; subida.error = {titulo, texto, avisos};
  pintarSubir();
  reels[0]?.scrollIntoView();
}

async function subirArchivos(archivos){
  if (!archivos.length) return;
  subida.estado = "leyendo";
  subida.archivos = archivos.map(f => ({nombre: f.name, estado: "en cola", clase: ""}));
  pintarSubir();
  reels[0]?.scrollIntoView();
  const lento = setTimeout(() => { const el = document.getElementById("lento"); if (el) el.textContent = "Sigue leyendo. Un PDF escaneado o una foto puede tardar hasta un minuto en el celular."; }, 12000);
  try { await leerYArmar(archivos); }
  catch (err) { fallo("No se pudo leer", (err && err.message) || "Algo falló leyendo el archivo. Prueba otra vez o con otro archivo."); }
  finally { clearTimeout(lento); }
}

async function leerYArmar(archivos){
  let r;
  {
    const L = await cargarLector();
    r = await L.leerTodo(archivos, {rutas: {pdfWorker: LECTOR + "pdf.worker.min.mjs", ocr: LECTOR + "ocr/"}, base: null,
      alProgreso: (nombre, estado) => {
        const a = subida.archivos.find(x => x.nombre === nombre); if (!a) return;
        a.estado = estado; a.clase = /^error/.test(estado) ? "err" : /ítem/.test(estado) ? "ok" : "";
        const li = [...document.querySelectorAll("#subir .archivos li")].find(li => li.firstElementChild.textContent === nombre);
        if (li) { li.className = a.clase; li.lastElementChild.textContent = estado; }
      }});
  }
  const ext = r.extraccion;
  if (!ext.items.length) {
    const errores = subida.archivos.filter(a => a.clase === "err").map(a => a.nombre + ": " + a.estado);
    return fallo(errores.length ? "No se pudo leer" : "No encontré backline",
      errores.length ? "El lector no pudo abrir el archivo." : "Leí el documento pero no vi una lista de equipos (cantidad y descripción). Si es una foto, que sea nítida y de cerca; si es un PDF escaneado, prueba con una foto de la hoja.",
      [...errores, ...ext.avisos]);
  }
  const d = aDatos(ext);
  const nombre = archivos.length === 1 ? archivos[0].name.replace(/\.[^.]+$/, "") : archivos.length + " archivos";
  doc = {nombre, archivos: archivos.map(f => f.name), cuando: new Date().toISOString(), datos: d};
  escribir("lab-reels:doc", doc);
  escribir("lab-reels:listos:doc", null);
  const categorias = [...new Set(d.items.map(i => i.categoria))];
  subida.estado = "listo";
  subida.resultado = {items: d.items.length, bandas: d.artistas.length, cats: categorias.length, dudosos: d.items.filter(i => i.porConfirmar).length, avisos: ext.avisos.length};
  pintar("subir");
  lluvia(categorias.map(c => EMOJI[c] || "📦"));
}

async function probarMuestra(){
  try {
    const b = await (await fetch(MUESTRA)).blob();
    subirArchivos([new File([b], "hoja-backline.pdf", {type: "application/pdf"})]);
  } catch { aviso("No pude abrir el ejemplo"); }
}

function lluvia(emojis){
  if (QUIETO || !emojis.length) return;
  const l = document.createElement("div"); l.className = "lluvia"; l.setAttribute("aria-hidden", "true");
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("span");
    s.textContent = emojis[i % emojis.length];
    s.style.left = Math.random() * 96 + "%";
    s.style.animationDelay = (Math.random() * .6).toFixed(2) + "s";
    s.style.setProperty("--r", (Math.random() * 540 - 270).toFixed(0) + "deg");
    l.append(s);
  }
  document.body.append(l); setTimeout(() => l.remove(), 2800);
}

/* ── Al abrir: el logo de Circuito Naranja con glitch, siempre, como TikTok. La mano que enseña cada gesto sale una sola vez. ── */
const vistos = new Set(leer("lab-reels:guias", []));
if (location.hash === "#intro") vistos.clear();
function guia(clave, tipo, texto, sub){
  if (vistos.has(clave) || document.querySelector(".guia")) return;
  vistos.add(clave); escribir("lab-reels:guias", [...vistos]);
  const dedo = tipo === "toque-g" ? "👆" : "☝️";
  const g = document.createElement("div"); g.className = "guia " + tipo; g.setAttribute("role", "dialog");
  g.innerHTML = `<div class="mano" aria-hidden="true"><span class="estela"></span><span class="dedo">${dedo}</span></div><p>${texto}</p><small>${sub}</small>`;
  const cerrar = () => { g.remove(); feed.removeEventListener("scroll", cerrar); };
  g.addEventListener("click", cerrar); feed.addEventListener("scroll", cerrar, {once: true, passive: true});
  document.body.append(g);
}
function guiaAlLlegar(r){
  if (document.querySelector(".splash:not(.fuera)")) return;
  if (r.id === "subir") cats.length && guia("arriba", "arriba-g", PC ? "Baja para ver cada categoría" : "Desliza hacia arriba", PC ? "Con la rueda del mouse, ↓ o los botones de la derecha" : "Cada pantalla es una categoría: Batería, Platillos, Bases…");
  else if (!vistos.has("lado")) setTimeout(() => actual === r && guia("lado", "lado-g", PC ? "Pasa con ›" : "Desliza a la izquierda", "Ahí está lo que hay que tener y cada banda con su plano"), 1400);
  else setTimeout(() => actual === r && guia("toque", "toque-g", "Doble toque = listo", "Marca la categoría cuando esté revisada"), 1400);
}
function splash(){
  return new Promise(ok => {
    const s = document.createElement("div"); s.className = "splash";
    const xlr = `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="43" fill="none" stroke="currentColor" stroke-width="8"/><rect x="44" y="3" width="12" height="9" rx="2" fill="currentColor"/><circle cx="31" cy="46" r="8" fill="currentColor"/><circle cx="69" cy="46" r="8" fill="currentColor"/><circle cx="50" cy="69" r="8" fill="currentColor"/></svg>`;
    const capa = c => `<div class="capa ${c}"${c ? ' aria-hidden="true"' : ""}><div class="marca">circuit${xlr}</div><div class="naranja">Naranja</div></div>`;
    s.innerHTML = `<div class="logo" role="img" aria-label="Circuito Naranja">${capa("")}${QUIETO ? "" : capa("cian") + capa("nar")}<small>BACKLINE EN REELS</small></div>`;
    document.body.append(s);
    setTimeout(() => { s.classList.add("fuera"); ok(); setTimeout(() => s.remove(), 500); }, QUIETO ? 600 : 1600);
  });
}

/* ── Arranque ── */
splash().then(() => { if (actual) guiaAlLlegar(actual); });
if (location.hash === "#intro") history.replaceState(null, "", location.pathname);
pintar(location.hash.slice(1));
</script>
