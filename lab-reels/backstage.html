<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backline">
<link rel="icon" href="data:,">
<title>Backstage Company · Backline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Quicksand:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Lab: el backline de ESC 2 como reels. Arriba/abajo cambia de categoría (Batería, Platillos…),
   izquierda/derecha pasa de la portada al resumen y a cada banda. Todo es CSS scroll-snap nativo. */
:root{
  --bg:#000; --surface:#121212; --surface2:#1a1a1a; --line:#333;
  --ink:#fff; --ink2:#d6d6d6; --ink3:#9a9a9a;
  --accent:#ff6a1f; --accent-ink:#000; --ok:#3fbf77; --warn:#ffa83a;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --gx:18px; --barra:54px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Feed vertical: un reel por pantalla */
#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;max-width:520px;margin:0 auto;position:relative}
#feed::-webkit-scrollbar{display:none}
.reel{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,hsl(var(--h) 90% 22%) 0%,#000 65%)}

/* Carrusel horizontal dentro del reel */
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
/* Las historias de los lados (listado, lo que pidió la banda, fotos…) se deslizan hacia abajo enteras: antes
   lo que no cabía quedaba cortado. Adentro ya no hay otro scroll, así el dedo mueve una sola cosa. */
.slide.banda{display:block;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding-bottom:calc(env(safe-area-inset-bottom) + 110px);scrollbar-width:none}
.slide.banda::-webkit-scrollbar{display:none}
.slide.banda{--tope:calc(env(safe-area-inset-top) + var(--barra) + 46px);-webkit-mask-image:linear-gradient(transparent var(--tope),#000 calc(var(--tope) + 22px));mask-image:linear-gradient(transparent var(--tope),#000 calc(var(--tope) + 22px))}
.slide.banda ul.lista,.slide.banda .rider,.slide.banda .cmp{overflow:visible;flex:none;max-height:none;mask-image:none;-webkit-mask-image:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;padding:calc(env(safe-area-inset-top) + var(--barra) + 58px) 76px calc(env(safe-area-inset-bottom) + 34px) var(--gx);display:flex;flex-direction:column;overflow:hidden}

/* Barra de progreso tipo historias */
.prog{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + var(--barra) + 6px);left:12px;right:12px;display:flex;gap:4px;pointer-events:none}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.prog i.on{background:var(--ink)}
.cab{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + var(--barra) + 18px);left:16px;right:16px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);pointer-events:none}
.cab b{font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.cab .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink3)}

/* Portada */
.portada{justify-content:flex-end}
.holo{flex:1;min-height:0;position:relative;margin:0 -76px 8px calc(-1 * var(--gx));display:flex;align-items:center;padding-left:var(--gx)}
.holo .lienzo3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.holo.con3d .emoji{display:none}
.emoji{font-size:clamp(90px,30vw,150px);line-height:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));transform:scale(.6);opacity:0;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.reel.visto .emoji{transform:none;opacity:1}
.portada h2{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,76px);line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:0;color:var(--accent);text-wrap:balance;overflow-wrap:anywhere}
.big{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}
.big strong{font-family:var(--display);font-size:clamp(80px,26vw,128px);line-height:.85;font-variant-numeric:tabular-nums}
.big span{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);line-height:1}
.dias{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--ink);white-space:nowrap}
.chip.ac{background:var(--accent);color:var(--accent-ink)}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
/* Portada de la banda: una fila de secciones para saltar a cada una (lo pidió el usuario). */
.ir-secciones{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 10px}
.ir-secciones button{flex:none;display:flex;align-items:center;gap:6px;font:600 14px/1 "IBM Plex Sans",sans-serif;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--accent);border-radius:999px;padding:8px 12px;cursor:pointer}
.ir-secciones button span{font-size:16px}
.chip.ter{background:transparent;border:1px solid var(--ink3);color:var(--ink2)}
.pista{margin-top:18px;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.pista .flecha{display:inline-block;animation:empuja 1.4s ease-in-out infinite}
@keyframes empuja{50%{transform:translateX(8px)}}

/* Listas */
h3{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--ink2);font-size:14px;margin:0 0 14px}
ul.lista{list-style:none;margin:0;padding:0;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;mask-image:linear-gradient(#000 88%,transparent)}
ul.lista li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
/* "En el listado" se ve como la planilla de Excel: hoja blanca, letra oscura y cuadrícula, sin naranja
   (lo pidió el usuario: el listado no debe competir con el resto). */
.excel{background:#fff;color:#1f1f1f;border:1px solid #c8c8c8;border-radius:6px;overflow:hidden;font-family:Calibri,"Segoe UI",Arial,sans-serif}
.excel .cab-xl,.excel ul.lista li{display:grid;grid-template-columns:52px 1fr 40px 34px;gap:0;align-items:stretch}
.excel .cab-xl{background:#f3f3f3;border-bottom:1px solid #c8c8c8;font-size:12px;font-weight:700;color:#444}
.excel .cab-xl span,.excel ul.lista li>span{padding:8px 10px}
.excel .cab-xl span:first-child,.excel ul.lista li>.q{border-right:1px solid #d9d9d9}
.excel .rider{max-height:none}
.excel ul.lista{margin:0;padding:0}
.excel ul.lista li{padding:0;border-bottom:1px solid #e3e3e3;background:#fff}
.excel ul.lista li:nth-child(even){background:#fafafa}
.excel ul.lista .q{font-family:inherit;font-size:15px;font-weight:600;color:#1f1f1f;text-align:right;min-width:0;line-height:1.3}
.excel ul.lista .q::after{content:" x";font-weight:400;color:#777}
.excel ul.lista .t{font-size:15px;line-height:1.3;color:#1f1f1f}
.excel ul.lista small{color:#666}
.excel .chip{background:#eef2f7;color:#333;border-color:#d4dbe5}
.excel .chip.warn{background:#fff4e5;color:#8a4b00;border-color:#f3d2a6}
.excel ul.lista li.editable{cursor:pointer}.excel ul.lista li.editable:hover{background:#eaf2ff}
ul.lista .q{font-family:var(--display);font-size:28px;font-weight:700;color:var(--accent);min-width:2.2ch;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
ul.lista .t{min-width:0;flex:1}
ul.lista .t small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
ul.lista .t .chip{font-size:11px;padding:1px 7px;margin:4px 4px 0 0;display:inline-block}
.barra{height:4px;border-radius:2px;background:var(--accent);opacity:.35;margin-top:6px}

/* Totales de fondo: detrás de un botón en la portada, encima de ella */
.ver-totales{align-self:flex-start;margin-top:14px;font-size:13px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}
.totales{position:absolute;inset:calc(env(safe-area-inset-top) + var(--barra) + 50px) 76px calc(env(safe-area-inset-bottom) + 24px) var(--gx);display:flex;flex-direction:column;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);border-radius:14px;padding:14px;z-index:4}
.totales .cerrar{align-self:flex-end;font-size:13px;color:var(--ink2);margin-bottom:6px}

/* La banda como viene en el rider: sus secciones en orden; lo de otra categoría, tenue */
.rider{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;mask-image:linear-gradient(#000 88%,transparent)}
.rider ul.lista{overflow:visible;flex:none;mask-image:none}
.rider .seccion{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:14px 0 0;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.25)}
.rider .seccion:first-child{margin-top:0}
.rider li.otra{opacity:.45}
.ver-cmp{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 12px;margin:0 0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:var(--ink2)}
.ver-cmp b{color:var(--warn);font-weight:700}
.ver-cmp.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ver-cmp.on b{color:inherit}
.cmp-pane{display:flex;flex-direction:column;flex:1;min-height:0}

/* Pide la banda | propuesta (Excel "Cant | Requerimiento | Cant | Propuesta") */
.vs{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.vs div{display:flex;flex-direction:column;align-items:center;line-height:1}
.vs b{font-family:var(--display);font-size:30px;color:var(--accent);font-variant-numeric:tabular-nums}
.vs span{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.vs .flecha{font-size:22px;color:var(--ink3);margin:0}
.vs.distinto{box-shadow:inset 0 0 0 1px var(--warn)}
.vs.distinto .flecha{color:var(--warn)}
.cmp{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;mask-image:linear-gradient(#000 90%,transparent);font-size:13px}
.cab-cmp,.fila-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cab-cmp{position:sticky;top:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);padding:4px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);z-index:1}
.fila-cmp{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.fila-cmp>div{display:flex;gap:6px;align-items:baseline;min-width:0}
.fila-cmp .q{font-family:var(--display);font-size:18px;font-weight:700;color:var(--accent);min-width:1.6ch;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.fila-cmp .q.sin{color:var(--ink3)}
.fila-cmp .t{min-width:0;overflow-wrap:anywhere}
.fila-cmp .vacio{border-left:2px dashed rgba(255,255,255,.12)}

/* Slide de banda con el stage plot de fondo */
.banda .fondo{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(16px) brightness(.22) saturate(.6);transform:scale(1.15);z-index:-1}
.banda{isolation:isolate}
.banda .plot{display:block;width:100%;max-height:26vh;object-fit:contain;border-radius:10px;background:#fff;margin:0 0 12px;cursor:zoom-in}
.hora{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

/* Riel de acciones a la derecha, como en los reels */
.riel{position:absolute;z-index:4;right:10px;bottom:calc(env(safe-area-inset-bottom) + 90px);display:flex;flex-direction:column;gap:18px;align-items:center}
.riel button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.riel .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);transition:transform .15s,background .15s}
.riel button:active .ic{transform:scale(.88)}
.riel .listo[aria-pressed="true"] .ic{background:var(--ok);color:#000}
.corazon{position:absolute;z-index:5;left:50%;top:45%;font-size:110px;pointer-events:none;transform:translate(-50%,-50%) scale(0);opacity:0}
.corazon.go{animation:pop .8s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}

/* Pista de deslizar hacia arriba en el primer reel */
.arriba{position:absolute;z-index:4;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);text-align:center;font-size:13px;color:var(--ink2);animation:sube 1.6s ease-in-out infinite;pointer-events:none}
@keyframes sube{50%{transform:translateY(-8px);opacity:.6}}

/* Índice y visor */
.hoja{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.hoja .panel{width:100%;max-width:520px;max-height:80dvh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.hoja h4{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0 0 8px;color:var(--accent)}
/* La hoja de detalle sube desde abajo; todo lo que es una pieza se puede tocar. */
.hoja .panel{animation:sube-hoja .34s cubic-bezier(.2,.9,.25,1.12)}
@keyframes sube-hoja{from{transform:translateY(100%)}}
.detalle{transition:transform .2s}
.detalle .agarre{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.detalle .donde{margin:0;font-size:13px;color:var(--ink2)}
.hoja h4.titulo-pieza{font-family:var(--display);font-size:32px;line-height:1;text-transform:none;color:var(--ink);margin:4px 0 6px}
.titulo-pieza .cant{color:var(--accent)}
.detalle .modelo{margin:0 0 6px;font-size:14px;color:var(--ink2)}
.detalle .nota{margin:6px 0;font-size:14px;color:var(--ink2)}
.detalle blockquote{margin:0;padding:10px 12px;border-left:3px solid var(--accent);background:rgba(255,255,255,.05);border-radius:6px;font-size:14px;line-height:1.4;color:var(--ink)}
.detalle .piezas{display:flex;flex-wrap:wrap;gap:8px}
.detalle .pieza{display:inline-flex;align-items:baseline;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:14px;color:var(--ink);text-align:left;transition:background .15s,transform .15s}
.detalle .pieza:active{transform:scale(.96)}
.detalle .pieza:hover,.detalle .pieza:focus-visible{background:rgba(255,255,255,.12);outline:none}
.detalle .pieza b{color:var(--accent)}
.detalle .pieza small{color:var(--ink3)}
.detalle .botones{margin-top:18px;justify-content:flex-start}
[data-item]{cursor:pointer}
ul.lista li[data-item],.vivo li[data-item]{transition:background .15s,transform .15s}
/* Chulo verde: el ítem ya está listo */
li.hecho .q,.vivo li.hecho b{color:#1fa34a}
li.hecho .q::before,.vivo li.hecho b::before{content:"✓ ";font-weight:800}
.excel ul.lista li.hecho,.excel ul.lista li.hecho:nth-child(even){background:#e7f6ec}
.excel ul.lista li.hecho .q,.excel ul.lista li.hecho .q *{color:#1a8f3e;font-weight:700}
ul.lista li.hecho .t{opacity:.75}
.vivo li.hecho{color:#7ee2a0}
.foto-pieza{flex:none;align-self:center;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.06);font-size:17px;line-height:1;cursor:pointer;padding:0}
.excel .foto-pieza{border-color:#d4dbe5;background:#f3f6fa}
.ver-pieza{flex:none;align-self:center;margin-left:auto;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:22px;line-height:1;opacity:.55;cursor:pointer}
.excel .ver-pieza{color:#555}
ul.lista li[data-item]:active,.vivo li[data-item]:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.hoja .panel{animation:none}}
.hoja .fila{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.hoja a.fila{color:inherit;text-decoration:none}
.hoja .fila .e{font-size:24px}
.hoja .fila .x{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums}
.hoja .fila .ok{color:var(--ok);font-weight:700}
.visor{position:fixed;inset:0;z-index:11;background:#000;display:grid;place-items:center;padding:16px}
.visor img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.aviso{position:fixed;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#000;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600}
.cargando{height:100dvh;display:grid;place-items:center;color:var(--ink3);text-align:center;padding:16px}
@media (min-width:700px){
  body{background:radial-gradient(circle at 50% 30%,#1a0d05,#000 60%)}
  #feed{border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .teclas{position:fixed;left:24px;bottom:24px;max-width:230px;font-size:13px;color:var(--ink3)}
  .teclas kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink2)}
}
@media (max-width:699px){.teclas{display:none}}
@media (min-width:900px) and (hover:hover){.teclas{left:auto;right:24px;text-align:right}}

/* En PC no se desliza con el dedo: flechas sobre el reel, ↑ ↓ al lado y el índice fijo a la izquierda. */
.lado,.flechas-v,.pasar{display:none}
@media (hover:hover) and (pointer:fine){
  .pasar{display:grid;place-items:center;position:absolute;z-index:4;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--line);font-size:20px;color:var(--ink);opacity:.75;transition:opacity .15s,background .15s}
  .pasar:hover,.pasar:focus-visible{opacity:1;background:var(--accent);color:var(--accent-ink);outline:none}
  .pasar.ant{left:8px}.pasar.sig{right:8px}
  :root{--gx:58px}
  .pasar[disabled]{display:none}
  .reel .riel{right:12px}
}
@media (max-width:699px){
  .pasar.sig{display:grid;place-items:center;position:absolute;z-index:4;right:12px;top:auto;bottom:calc(env(safe-area-inset-bottom) + 28px);margin-top:0;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:1px solid var(--line);font-size:22px;color:var(--ink)}
  .pasar.sig[disabled]{display:none}
  .pasar.ant{display:none}
}
@media (min-width:900px) and (hover:hover){
  .flechas-v{display:flex;flex-direction:column;gap:10px;position:fixed;z-index:6;top:50%;left:calc(50% + 260px + 20px);transform:translateY(-50%)}
  .flechas-v button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;transition:background .15s,border-color .15s}
  .flechas-v button:hover,.flechas-v button:focus-visible{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);outline:none}
  .flechas-v button[disabled]{opacity:.3;pointer-events:none}
  .lado{display:block;position:fixed;z-index:6;top:24px;bottom:120px;right:calc(50% + 260px + 24px);width:min(240px,calc(50vw - 300px));overflow-y:auto;scrollbar-width:thin}
  .lado h1{font-family:var(--display);font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin:0 0 4px}

.mano .dedo{position:absolute;left:50%;font-size:64px;line-height:1;transform:translateX(-50%)}
.mano .estela{position:absolute;left:50%;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(transparent,rgba(255,255,255,.8))}
.guia.arriba-g .dedo{animation:dedo-v 1.5s ease-in-out infinite}

@keyframes dedo-v{0%{top:90px;opacity:0}15%{opacity:1}70%{top:0;opacity:1}100%{top:0;opacity:0}}
@keyframes estela-v{0%,15%{height:0}70%{height:90px;opacity:1}100%{height:90px;opacity:0}}
.guia.lado-g .mano{width:170px;height:90px}
.guia.lado-g .dedo{top:10px;animation:dedo-h 1.5s ease-in-out infinite}
.guia.lado-g .estela{display:none}

.guia.toque-g .dedo{top:30px;animation:toque 1.2s ease-in-out infinite}

/* ── Barra de arriba: perfil, buscador y filtros (los dos perfiles buscan y filtran) ── */

/* Modo normal: una pantalla por banda, con sus fotos */
.fotos-banda{margin:0 0 12px}
.fila-fotos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.kpi{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi b{display:block;font:700 30px/1 "Barlow Condensed",sans-serif}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.ok b{color:#1fa34a}.kpi.warn b{color:#ffd27a}
.r-seccion{display:flex;justify-content:space-between;width:100%;margin:14px 0 6px;padding:0;background:none;border:0;color:var(--accent);font:700 20px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;text-align:left;cursor:pointer}
.resumen .excel .cab-xl,.resumen .excel ul.lista li{grid-template-columns:40px 1fr 30px 40px 40px}

.evento-nuevo b{color:var(--accent)}.evento-nuevo span{flex:1}.evento-nuevo a{flex:none;padding:8px 14px;border-radius:999px;background:var(--accent);color:#000;font-weight:700;text-decoration:none}.evento-nuevo button{flex:none;background:none;border:0;color:var(--ink);font-size:20px;padding:4px 6px}

.faltan{margin:14px 0 0;padding:10px 12px;border:1px dashed #f5b83d;border-radius:12px;background:rgba(255,190,60,.06)}

.pieza-fotos{padding:10px 0;border-bottom:1px solid var(--line)}

.botones-foto{display:flex;gap:8px;margin-top:8px}

.portada-banda .holo{flex:1 1 auto;min-height:20vh}
.portada-banda h2{font-size:clamp(34px,10vw,60px)}

.chips-pieza{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}

<main id="feed" aria-label="Backline por categoría"></main>
<div class="teclas" id="teclas"><b>Lab reels.</b> En el celular se desliza. Aquí: <kbd>↑</kbd><kbd>↓</kbd> sección, <kbd>←</kbd><kbd>→</kbd> a los lados. Arriba de todo: subir un documento.</div>

  </nav>
</header>

<div class="hoja" id="detalle" hidden><div class="panel detalle" role="dialog" aria-label="Detalle del equipo"></div></div>
