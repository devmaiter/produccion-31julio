<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backline de hoy</title>
<meta name="description" content="El backline del evento del día en reels, pieza por pieza.">
<meta property="og:title" content="Backline de hoy · Circuito Naranja">
<meta property="og:description" content="La salida de equipo del evento del día, banda por banda.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;text-align:center}a{color:#ff6a1f}p{margin:.6em 16px}</style>
</head>
<body>
<!-- Link corto del evento del día. Qué evento es lo dice hoy/evento.json (listas y nombre del documento), que se
     lee sin caché cada vez: así el celular nunca se queda con el evento anterior aunque guarde esta página.
     Para otro evento, cambiar solo evento.json y dejar el anterior en hoy/<día>/ (como hoy/17-oct/), para no
     perder sus chulos, fotos y notas. -->
<main>
  <p id="msg">Abriendo el backline de hoy…</p>
  <p><a id="ir" href="../lab-reels/?lista=listas/listado-2026-10-24.txt&amp;doc=listado-2026-10-24">Abrir</a></p>
  <p><a href="22-oct/">Evento anterior: 22 y 23 de octubre</a> · <a href="17-oct/">17 de octubre</a></p>
</main>
<script>
(async () => {
  const ir = document.getElementById("ir");
  let destino = ir.href;   // si no hay señal, el último evento conocido
  try {
    const r = await fetch("evento.json?t=" + Date.now(), {cache: "no-store"});
    if (r.ok) {
      const e = await r.json();
      if (Array.isArray(e.listas) && e.listas.length && /^[\w.-]{1,60}$/.test(e.doc || "")) {
        destino = "../lab-reels/?lista=" + e.listas.join(",") + "&doc=" + e.doc;
        if (e.titulo) document.getElementById("msg").textContent = "Abriendo " + e.titulo + "…";
      }
    }
  } catch {}
  ir.href = destino;
  location.replace(destino);
})();
</script>
</body>
</html>
